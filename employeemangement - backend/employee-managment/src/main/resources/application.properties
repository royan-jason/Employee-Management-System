
spring.datasource.url=jdbc:mysql://localhost:3306/employeeManagement
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect

## JWT Properties
# jwt.secret must be at least 256 bits (32+ characters) for the HS256 algorithm.
jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (below: 24 hours)
jwt.expiration-ms=86400000

## Default admin account
# Seeded automatically on startup (see AdminAccountInitializer) if this username
# doesn't already exist. Has full read/write access; every other registered
# user defaults to read-only (ROLE_USER).
app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_MAIL}
app.admin.password=${ADMIN_PASSWORD}


